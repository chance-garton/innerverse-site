name = "innerverse-contact"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
TO_EMAIL = "chance@innerversepodcast.com"
FROM_EMAIL = "contact@innerversepodcast.com"
ALLOWED_ORIGINS = "https://www.innerversepodcast.com,https://innerversepodcast.com,https://chance-garton.github.io"
# Secret, set in Cloudflare (not here): RESEND_API_KEY

# At most 5 sends a minute from one address (2026-11-09).
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
