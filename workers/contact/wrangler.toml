name = "innerverse-contact"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
TO_EMAIL = "chance@innerversepodcast.com"
FROM_EMAIL = "contact@innerversepodcast.com"
ALLOWED_ORIGINS = "https://www.innerversepodcast.com,https://innerversepodcast.com"
# Secret, set in Cloudflare (not here): RESEND_API_KEY

# One message an hour from one address (2026-11-09): a Durable Object per address.
[[durable_objects.bindings]]
name = "SEND_LIMIT"
class_name = "SendLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SendLimit"]
