name: Copy episode audio to R2

# Copies the free episode audio from Acast into our own R2 bucket so the
# site, the app and the members' feed never depend on a podcast host.
# Run by hand from the Actions tab: batch "test" (newest 3), a number N
# (next N not yet copied) or "all". Safe to rerun: finished files are
# skipped and nothing is overwritten. Commits data/audio/map.json and a run
# report in data/audio/runs/.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "test, a number, all, sources (data/audio/sources.json), or feed / feed-test (published Acast episodes with no page)"
        required: true
        default: "test"

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      BATCH: ${{ inputs.batch }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chance-garton/innerverse-data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - name: Tools for audio from outside Acast (sources batch only)
        if: ${{ inputs.batch == 'sources' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install "yt-dlp[default]" yt-dlp-ejs
      - uses: denoland/setup-deno@v2
        if: ${{ inputs.batch == 'sources' }}
      - name: Copy the batch
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_AUDIO_ACCESS_KEY_ID: ${{ secrets.R2_AUDIO_ACCESS_KEY_ID }}
          R2_AUDIO_SECRET_ACCESS_KEY: ${{ secrets.R2_AUDIO_SECRET_ACCESS_KEY }}
          R2_AUDIO_BUCKET: innerverse-audio
          AUDIO_BASE_URL: https://audio.innerversepodcast.com
        run: python tools/audio/copy_audio.py "$BATCH" --data _data
      - name: Save the map and the run report
        if: always()
        run: |
          git config user.name "innerverse-audio"
          git config user.email "actions@users.noreply.github.com"
          git add data/audio/map.json data/audio/runs || true
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Audio: batch $BATCH copied to R2"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: Remove temporary audio-import branches (sources batch, after a clean run)
        if: ${{ success() && inputs.batch == 'sources' }}
        run: |
          for b in $(grep -o 'innerverse-site/audio-import-[A-Za-z0-9-]*' data/audio/sources.json | cut -d/ -f2 | sort -u); do
            git push origin --delete "$b" || true
          done
