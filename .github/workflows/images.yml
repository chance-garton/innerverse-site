name: Copy images to R2

# Stage 2 of the image move (claude/BRIEF-image-migration-2026-10-30.md).
# Run by hand from the Actions tab with a batch name from
# data/images/batches.json. Copies that batch's images from Squarespace into
# the R2 bucket, checks each file answers from the public address, and
# commits data/images/map.json plus a run report in data/images/runs/.
# Safe to rerun: finished images are skipped, nothing is overwritten.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch name from data/images/batches.json (for example 0)"
        required: true

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow boto3
      - name: Copy the batch
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: python tools/images/migrate.py "${{ inputs.batch }}"
      - name: Save the map and the run report
        if: always()
        run: |
          git config user.name "innerverse-images"
          git config user.email "actions@users.noreply.github.com"
          git add data/images/map.json data/images/runs || true
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Images: batch ${{ inputs.batch }} copied to R2"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
